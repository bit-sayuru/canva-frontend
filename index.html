<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <title>Canva Pro Access</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #161b22;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid #30363d;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #238636;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { background: #555; }
    .msg { margin-top: 15px; font-size: 14px; }
    .success { color: #3fb950; }
    .error { color: #f85149; }
  </style>
</head>
<body>

<div class="box">
  <h3>Claim Canva Pro Access</h3>
  <input type="email" id="email" placeholder="ඔබගේ Gmail ලිපිනය ඇතුළත් කරන්න">
  <button id="btn" onclick="triggerInvite()">Get Invitation</button>
  <div id="msg" class="msg"></div>
</div>

<script>
  // ඔබගේ GitHub විස්තර මෙතැනට ලබා දෙන්න
  const GITHUB_USERNAME = "bit-sayuru";
  const GITHUB_REPO = "canva-invite-bot";
  const GITHUB_TOKEN = "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";

  async function triggerInvite() {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    if (!email) {
      msg.className = "msg error";
      msg.innerText = "කරුණාකර Email ලිපිනයක් ඇතුළත් කරන්න.";
      return;
    }

    btn.disabled = true;
    msg.className = "msg";
    msg.innerText = "ඉල්ලීම යවමින් පවතී...";

    try {
      const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/dispatches`, {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github.v3+json",
          "Authorization": `Bearer ${GITHUB_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          event_type: "send-invite",
          client_payload: { email: email }
        })
      });

      if (response.status === 204) {
        msg.className = "msg success";
        msg.innerText = "ඉල්ලීම සාර්ථකව භාරගන්නා ලදී! ඔබගේ Email එක අනුමත ලැයිස්තුවේ ඇත්නම් තත්පර කිහිපයකින් Invitation එක Inbox එකට ලැබෙනු ඇත.";
        document.getElementById("email").value = "";
      } else {
        msg.className = "msg error";
        msg.innerText = "දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.";
      }
    } catch (e) {
      msg.className = "msg error";
      msg.innerText = "සම්බන්ධතා දෝෂයකි.";
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
